    <script>
const para = document.getElementById('parallax-1');

window.addEventListener('scroll', () => {
  const y = window.scrollY;
  // 0.3 = l’élément bouge 3x moins vite que le scroll
  para.style.transform = `translateY(${y * 0.3}px)`;
});


    </script>
