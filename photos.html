        }

            background: none;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
            font-style: italic;
        }

        .bar {
            flex: 1;
            height: 10px;
            background: #333;
            position: relative;
            cursor: pointer;
            border-radius: 5px;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: 0;
        }

            font-size: 20px;

        }
